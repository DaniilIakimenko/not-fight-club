<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Не Бойцовский Клуб | Создайте персонажа</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/register.css">
</head>

<body>
  <main class="main">
    <div class="container">
      <div class="register-wrapper">
        <h1 class="title register-title">Введите имя персонажа</h1>
        <input 
          type="text" 
          class="character-name-input-reg"
          id="characterName"
          minlength="1" 
          maxlength="16" 
          required 
          placeholder="имя персонажа"
        >
        <button class="btn btn-register" onclick="saveCharName()">Создать</button>
      </div>
    </div>
  </main>

  <script src="/js/register.js"></script>
</body>

</html>
